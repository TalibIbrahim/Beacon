name = "beacon-auto-stop"
main = "src/index.ts"
compatibility_date = "2024-04-01"

[triggers]
crons = ["*/10 * * * *"]

# Cloudflare KV binding: must be the same namespace as the dashboard (wrangler.jsonc)
[[kv_namespaces]]
binding = "DASH_KV"
id = "ea5e590c0bd749b0acd7fe941cc9b706"

# D1 binding: same database as the dashboard (wrangler.jsonc). Used to record the stop event
# (Discord, de-duplicated with the dashboard and the agent) and to stay away while a restore runs.
[[d1_databases]]
binding = "DASH_DB"
database_name = "beacon-agent"
database_id = "eabc4e41-2f5a-4c05-830a-4b3e8bb53713"

[vars]
OCI_REGION = "me-dubai-1"
AUTO_STOP_MINUTES = "30"
